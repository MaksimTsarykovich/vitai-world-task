# Запуск лендинга «Кварта»: приложение + постоянный том с базой SQLite.
#   cp .env.example .env        # при необходимости
#   docker compose up -d --build
services:
  web:
    build:
      context: ./web
      args:
        # SITE_URL вшивается в статические canonical/OG/robots/sitemap при сборке
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    image: kvarta-web:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Версия для VPS всегда пишет в том /data. Turso здесь не подставляется
      # автоматически: docker compose читает .env проекта, и путь к базе Vercel
      # молча уводил бы контейнер в облако. Нужен Turso — поменяйте строку явно.
      DATABASE_URL: file:/data/kvarta.db
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      LEAD_RATE_LIMIT: ${LEAD_RATE_LIMIT:-20}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - kvarta-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  kvarta-data:
